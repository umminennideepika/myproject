<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section id="contact">
    <h1>contact me</h1>
    <p>Have a project in mind or just want to say hi? My inbox is always open.</p>
    <form>
        <label for="name">your Name:</label>
        <input type="name" placeholder="enter your name">
        <br>
        <label for="email">your Email:</label>
        <input type="email" placeholder="enter your email">
        <br>
        <label for="phone"> Phone no.</label>
        <input type="phone" placeholder="enter your phone number">
       <br>
        <b>choose your gender:</b>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">female</label>
        <br>
        <b>select your interest:</b>
         <select>
            <option value="">-- please select --</option>
             <option value="coding">coding</option>
             <option value="reading">reading</option>
         </select>
         <br>
         <label for="bio">bio(up to 200 characters):</label>
         <input type="text">
          <p>
        🔗 LinkedIn:
        <a href="https://www.linkedin.com/">LinkedIn Profile</a>
    </p>

    <p>
        💻 GitHub:
        <a href="https://github.com/">GitHub Profile</a>
    </p>
            <br>
         <button type="submit">submit</button>
        </form>
        </section>
</body>
</html>
